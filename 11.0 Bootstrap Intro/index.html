<!-- 
Bootstrap 12-column system

In bootstrap, evrything is housed inside a container and the container contains another div to represent
rows, the items inside can be placed using column. Bootstrap will place cols inside rows with equal
spacing and would span them across the entire width of the container. If there are 3 cols inside a container,
the entire container width will be divided by 3 to accomodate 3 cols.

Eg:
<div class="container">
  <div class="row">
    <div class="col"></div>
  </div>    
</div>

If a div element has class of col-2 then that would occupy two column width, for col-6 the div will occupy
50% of the entire width. we can use col-2 to col-12 based on our need.

There are 6 breakpoints in bootstrap, they are sm(small),md(medium),lg(large),xl(extralarge),xxl(extra extra large)
sm is for mobile, md for ipad and tablets, lg for laptops, xl for desktops, xxl for TV's

-->
