<!-- 1. Fixed size grid is not responsive. It is mentioned by specifying the exact value of pixel/rem etc in the defined row and column values
Eg: 
.container{
  display:grid;
  grid-template-rows: 100px 300px       or grid-template:100px 300px/400px 800px
  grid-template-columns: 300px 600px
} 

2. Auto size grid is responsive. It is mentioned by specifying the either row/column value as auto. If row is mentioned as auto it would only be high/large enough as the content
it fits. If column is mentioned as auto the column would expand until it fits the rest of the space in the screen.
Eg:
.container{
  display:grid;
  grid-template-rows: 100px auto
  grid-template-columns: 300px auto
} 

3. Fractional size grid is responsive and is mentioned by specifying the row and column values as fr/fractions/ratios. Fractional grids will grow/shrink depending on the residual
space in the screen w.r.to columns and would become high/large enough to fit the content w.r.to rows.
Eg:
.container{
  display:grid;
  grid-template-rows: 1fr 2fr
  grid-template-columns: 1fr 3.5fr
} 

4. Minmax grid is responsive and we define the min width & the max width, we want our column to be
Eg: 
.container {
  display: grid;
  grid-template-rows: 200px minmax(400px, 5fr);
  grid-template-columns: 200px minmax(400px, 5fr);
}

5.Repeat grid is responsive & is used when repetition is involved in grid sizing.
.container {
  display: grid;
  grid-template-rows: repeat(2, 200px);
  grid-template-columns: repeat(2, 200px);
}

Note: when the contents needed to be inserted inside a grid is 4 and we've defined a 3 x 2 grid then the 2nd & 3rd column in the 2nd row will not have any content inserted and
would seem as there are no grids there, this is because the grid starts from top left and progreses to the bottom right.

Note: when a 2x2 grid is defined, but there are 5 html elements. The last grid would take the height of its content and the width  .
-->
