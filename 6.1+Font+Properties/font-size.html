<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Font-Size</title>
    <style>
      #pixel {
        font-size: 20px;
      }

      #point {
        font-size: 20pt;
      }

      #em {
        font-size: 1em;
      }

      #rem {
        font-size: 1rem;
      }

      footer {
        font-size: 12pt;
      }

      html {
        font-size: xx-large;
      }
    </style>
  </head>

  <body>
    <p id="pixel">1 Pixel is 1/96 of an Inch</p>
    <p id="point">1 Point is 1/72 of an Inch</p>
    <footer>
      <p id="em">1em is 100% the size of the parent element</p>
      <p id="rem">1rem is 100% the size of the root element</p>
    </footer>
  </body>
</html>

<!-- em and rem are relative size units. Eg: 1em = 1 * parent tag unit size, 1rem = 1 * root of the tag(html tag) -->
<!-- font-weight is determined by keywords such as normal, bold or relative to the parent tag by specifying 'lighter'(parent tag font weight - 100), 'bolder'(parent tag font weight +100) 
or also using numbers from 100 -900 -->
