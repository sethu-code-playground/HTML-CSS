<!-- If a mix of inline and block elements are enclosed and given a property flex then they all would ignore their previous display property and would be laid one after the 
other. The size of the flex is determined by the contents inside of it  
When the display property is set to inline-flex then the elements with inline flex display will be laid next to the previous element-->
