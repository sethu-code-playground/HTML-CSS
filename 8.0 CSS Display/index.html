<head>
  <title>CSS Display Property Example</title>
  <style>
    p {
      color: white;
    }

    .red {
      /* display: inline-block; */
      display: block;
      width: 200px;
      height: 200px;
      background-color: red;
    }

    .green {
      /* display: inline-block; */
      display: block;
      width: 200px;
      height: 200px;
      background-color: green;
    }

    .blue {
      /* display: inline-block; */
      display: block;
      width: 200px;
      height: 200px;
      background-color: blue;
    }
  </style>
</head>


<body>
  <h1>CSS Display Property</h1>
  <p class="red">Red Paragraph </p>
  <p class="green">Green Paragraph</p>
  <p class="blue">Blue Paragraph</p>
</body>

</html>

<!-- 
  1. Inline -> element with display property set to inline would display the element in the same line. We can't set width and height of the inline element, they default to
  the size of their content.
  2. Block -> elements would occupy the entire space and the next element will be inserted in the new line.
  3. Inline-Block -> they behave as inline elements and we can set width and height to these elements.
  4. None -> element with this display property set will not be visible in the screen.
 -->
