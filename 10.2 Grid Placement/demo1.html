<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Placement</title>
  <style>
    body {
      padding: 0;
      margin: 0;
    }

    .container {
      height: 100vh;
      display: grid;
      gap: 3rem;
      grid-template-columns: 1fr 1fr 1.5fr;
      grid-template-rows: 1fr 1fr;
    }

    .item {
      font-size: 5rem;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      background-color: blueviolet;
      display: flex;
      align-items: center;
      justify-content: center;
    }


    .cowboy {
      background-color: #00B9FF;
      grid-column: span 2;
    }

    /* grid-column property used when a grid item needs to occupy more than one column and is the
    shorthand for two properties

    grid-column-start
    grid-column-end
    
    we can specify the grid line numbers to these properties to place items inside a grid container
    these numbers can be positive or negative, for instance grid-column: span 2; can also be written as
    
    grid-column-start:1
    grid-column-end:3
    
    Similarly, there is also property called grid-row which behaves exactly like grid-column but is used
    when a grid item needs to occupy more than one row. It is also the shorthand of two properties

    grid-row-start
    grid-row-end
    
    */
  </style>
</head>

<body>
  <div class="container">
    <div class="item cowboy">🤠</div>
    <div class="item astronaut">👨‍🚀</div>
    <div class="item book">📖</div>
  </div>
</body>

</html>
